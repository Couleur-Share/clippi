name: Publish website installers

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub Release tag to publish
        required: true

permissions:
  contents: read

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.release.prerelease == false && github.event.release.draft == false) }}
    runs-on: ubuntu-22.04
    # Serialize automatic publications and manual backfills.
    # `queue: max` keeps every publication queued instead of letting a
    # third run cancel the pending one (the default is `queue: single`).
    concurrency:
      group: clippi-oss-publish
      cancel-in-progress: false
      queue: max
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
      OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
      OSS_ENDPOINT: "oss-cn-shanghai.aliyuncs.com"
      OSS_BUCKET: "rains-ailurus-cn"
      OSS_PREFIX: "clippi/releases"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verify release is stable
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease |
            jq -e '.isDraft == false and .isPrerelease == false'

      - name: Download release installers
        run: |
          set -euo pipefail
          mkdir artifacts
          gh release download "$TAG" \
            --repo "${{ github.repository }}" \
            --dir artifacts \
            --pattern 'Clippi_*_x64-setup.exe' \
            --pattern 'Clippi_aarch64.dmg' \
            --pattern 'Clippi_x86_64.dmg'

      - name: Extract release notes
        run: |
          set -euo pipefail
          VERSION="${TAG##*/}"
          VERSION="${VERSION#v}"
          bash scripts/extract_release_notes.sh "$VERSION" RELEASES.md > release-notes.md
          test -s release-notes.md

      - name: Publish installers and update manifest to Alibaba Cloud OSS
        run: |
          set -euo pipefail
          python3 -m pip install --user --quiet oss2
          python3 scripts/publish_oss.py \
            --artifacts artifacts \
            --tag "$TAG" \
            --notes-file release-notes.md
